site_name: Study Materials — Interview Prep
site_url: https://kris-na238.github.io/study-materials/
repo_url: https://github.com/kris-na238/study-materials

# The CI workflow copies the repo's markdown into _site_src before building,
# because MkDocs can't use the config's own directory as docs_dir.
docs_dir: _site_src
site_dir: _site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.tasklist
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      toc_depth: 3
      # GitHub-style heading anchors so existing in-doc TOC links keep working
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: { case: lower }

validation:
  links:
    not_found: info
    anchors: info
    unrecognized_links: info
